<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<title>Verificador de Pedidos VW</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef0f3;--card:#fff;--tx:#1b2433;--mut:#6a7485;--pri:#001e50;--acc:#001e50;--bd:#cfd5de;--ok:#0b5d3b;--hd:#f6f7f9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141d;--card:#151d29;--tx:#e6ebf2;--mut:#9aa6b8;--pri:#0a2a66;--acc:#8fb4f0;--bd:#2b3950;--ok:#5fd7a0;--hd:#1b2535}}
:root[data-theme="dark"]{--bg:#0e141d;--card:#151d29;--tx:#e6ebf2;--mut:#9aa6b8;--pri:#0a2a66;--acc:#8fb4f0;--bd:#2b3950;--ok:#5fd7a0;--hd:#1b2535}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-feature-settings:"tnum","cv11";line-height:1.45}
header{background:var(--pri);color:#fff;padding:22px 20px;border-bottom:3px solid #8a94a6}
header .in{max-width:860px;margin:0 auto}
header h1{margin:0;font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-size:1.4rem;font-weight:600;letter-spacing:.01em}
header p{margin:6px 0 0;font-size:.78rem;opacity:.75;text-transform:uppercase;letter-spacing:.12em}
main{max-width:860px;margin:0 auto;padding:24px 16px 48px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:3px;padding:20px;margin-bottom:18px}
h2.sec{margin:0 0 12px;font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-size:1rem;font-weight:600;color:var(--acc);border-bottom:1px solid var(--bd);padding-bottom:8px}
#drop{border:1px solid var(--bd);border-radius:3px;background:var(--hd);padding:28px 16px;text-align:center;cursor:pointer;color:var(--mut);font-size:.9rem}
#drop.over,#drop:hover{border-color:var(--acc);background:var(--card)}
#drop b{color:var(--tx);font-weight:600}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--bd)}
input[type=number]{width:90px;padding:7px 9px;border:1px solid var(--bd);border-radius:3px;background:var(--card);color:var(--tx);font-size:.95rem}
label{font-size:.85rem;color:var(--mut)}
.pedido{border-top:3px solid var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0;border:1px solid var(--bd)}
.grid>div{padding:12px 14px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);margin:-0.5px}
.grid>div:nth-child(odd){background:var(--hd)}
.k{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin-bottom:3px}
.v{font-size:1rem;font-weight:600;word-break:break-all;font-variant-numeric:tabular-nums}
.big{color:var(--ok);font-size:1.15rem}
.warn{color:#a93226;font-size:.85rem}
.cp{margin-left:8px;padding:2px 9px;font-size:.68rem;border:1px solid var(--bd);border-radius:3px;background:var(--card);color:var(--mut);cursor:pointer;vertical-align:middle;font-weight:400;letter-spacing:.03em}
.cp:hover{border-color:var(--acc);color:var(--tx)}
.cp.ok{background:var(--ok);border-color:var(--ok);color:#fff}
details{margin-top:10px;font-size:.8rem;color:var(--mut)}
pre{white-space:pre-wrap;max-height:200px;overflow:auto}
footer{max-width:860px;margin:0 auto;padding:0 16px 24px;font-size:.72rem;color:var(--mut);text-align:center}
.brand{display:flex;align-items:center;gap:16px}.logo{width:54px;height:54px;flex:none}
.brand h1{font-size:1.5rem}
[hidden]{display:none!important}
.btn{padding:7px 14px;font-size:.8rem;border:1px solid var(--bd);border-radius:3px;background:var(--card);color:var(--tx);cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--acc)}
.btn.del{color:#a93226}
#fname{font-size:.85rem;color:var(--mut);flex:1;min-width:140px;word-break:break-all}
.cx{margin-left:8px;padding:8px 14px;font-size:.85rem;border:1px solid var(--bd);border-radius:3px;background:var(--card);color:var(--tx);cursor:pointer;font-family:inherit}
.cx:hover{border-color:var(--acc)}
.cx.ok{background:var(--ok);border-color:var(--ok);color:#fff}
</style>
</head>
<body>
<header><div class="in brand"><svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Volkswagen"><circle cx="50" cy="50" r="46" fill="#001e50" stroke="#fff" stroke-width="4"/><g fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="miter" stroke-linecap="butt"><path d="M33 14 L50 54 L67 14"/><path d="M17 30 L33 80 L50 46 L67 80 L83 30"/></g></svg><div><h1>Verificador de Pedidos</h1><p>Volkswagen · Listado de Pedidos</p></div></div></header>
<main>
<div class="card">
  <h2 class="sec">Carga de documento</h2>
  <div id="drop"><b>Tocá o arrastrá acá el PDF</b><br>Listado de Pedidos (.pdf)</div>
  <input id="file" type="file" accept="application/pdf" hidden>
  <div class="row" id="bar" hidden><span id="fname"></span><button class="btn" id="btnNew" type="button">Cargar otro PDF</button><button class="btn del" id="btnDel" type="button">Borrar</button></div>
  <div class="row">
    <label for="pct">Descuento (%)</label>
    <input id="pct" type="number" min="0" max="100" step="0.01" value="0">
    <label id="pnote">Se aplica sobre el Val.Neto.</label>
  </div>
</div>
<div id="out"></div>
</main>
<footer>Los archivos se procesan en el navegador y no se almacenan.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const drop=$('drop'),file=$('file'),out=$('out'),pct=$('pct');
let pedidos=[],rawText='',manual=false;

drop.onclick=()=>file.click();
file.onchange=()=>{const f=file.files[0];file.value='';f&&leer(f)};
const bar=$('bar');
$('btnNew').onclick=()=>file.click();
$('btnDel').onclick=()=>{pedidos=[];rawText='';out.innerHTML='';bar.hidden=true;file.value='';manual=false;pct.value=0;$('pnote').textContent='Se aplica sobre el Val.Neto.'};
['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',ev=>{const f=ev.dataTransfer.files[0];f&&leer(f)});
pct.oninput=()=>{manual=true;$('pnote').textContent='Valor ingresado manualmente.';render()};

const num=s=>parseFloat(s.replace(/\./g,'').replace(',','.'));
const fmt=n=>n.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});

async function leer(f){
  out.innerHTML='<div class="card">Leyendo PDF…</div>';
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
    let t='';
    for(let i=1;i<=pdf.numPages;i++){
      const p=await pdf.getPage(i);
      const c=await p.getTextContent();
      t+=c.items.map(x=>x.str).join(' ')+' \n ';
    }
    rawText=t.replace(/\s+/g,' ');
    pedidos=extraer(rawText);
    manual=false;const au=pedidos.find(x=>x.pctAuto!=null);
    pct.value=au?au.pctAuto:0;
    $('pnote').textContent=au?'Detectado automáticamente del PDF.':'No se encontró descuento en el PDF; queda en 0.';
    $('fname').textContent='Archivo: '+f.name;bar.hidden=false;
    render();
  }catch(e){
    out.innerHTML='<div class="card warn">No se pudo leer el PDF: '+e.message+'</div>';
  }
}

function extraer(t){
  const h=/Informaci[oó]n del Pedido para el nro de doc\w* de venta\.?\s*(\d{8,12})/gi;
  const cortes=[];let m;
  while((m=h.exec(t)))cortes.push({i:m.index,doc:m[1]});
  if(!cortes.length)cortes.push({i:0,doc:(t.match(/\b0\d{9}\b/)||[''])[0]});
  return cortes.map((c,k)=>{
    const seg=t.slice(c.i,k+1<cortes.length?cortes[k+1].i:undefined);
    const g=(re)=>{const r=seg.match(re);return r?r[1]:null};
    const neto=g(/Val\.?\s*Neto\s*:?\s*(-?[\d.]+,\d{2})/i);
    const desc=g(/\bDesc\.?\s*:?\s*(-?[\d.]+,\d{2})/i);
    return{
      doc:c.doc||null,
      ped:g(/Nro\.?\s*Pedi\.?\s*Con\.?\s*(?:C\s*:\s*)?([A-Z0-9]{6,})/i),
      fecha:g(/Fecha\s*:?\s*(\d{2}[-\/]\d{2}[-\/]\d{4})/i),
      neto:neto?num(neto):null,
      descPdf:desc?num(desc):null,
      pctAuto:(neto&&desc&&num(neto))?Math.round(Math.abs(num(desc))/num(neto)*10000)/100:null
    };
  });
}

const rowsX=[];
document.addEventListener('click',async e=>{
  const b=e.target.closest('.cx');if(!b)return;
  const r=rowsX[b.dataset.i];if(!r)return;
  const tsv=r.join('\t');
  const st=["mso-number-format:'\\@';width:110px","mso-number-format:'\\@';width:95px","mso-number-format:'dd\\/mm\\/yyyy';width:95px","width:130px","width:130px","width:140px"];
  const html='<table><tr>'+r.map((v,k)=>'<td style="'+st[k]+'">'+v+'</td>').join('')+'</tr></table>';
  try{
    await navigator.clipboard.write([new ClipboardItem({'text/plain':new Blob([tsv],{type:'text/plain'}),'text/html':new Blob([html],{type:'text/html'})})]);
  }catch(_){
    try{await navigator.clipboard.writeText(tsv)}catch(__){
      const a=document.createElement('textarea');a.value=tsv;document.body.appendChild(a);a.select();
      try{document.execCommand('copy')}catch(___){}a.remove();
    }
  }
  const o=b.textContent;b.textContent='¡Copiado!';b.classList.add('ok');
  setTimeout(()=>{b.textContent=o;b.classList.remove('ok')},1200);
});
const cpBtn=t=>t?`<button class="cp" data-c="${t}">Copiar</button>`:'';
document.addEventListener('click',async e=>{
  const b=e.target.closest('.cp');if(!b)return;
  const t=b.dataset.c;
  try{await navigator.clipboard.writeText(t)}catch(_){
    const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();
    try{document.execCommand('copy')}catch(__){}a.remove();
  }
  const orig=b.textContent;b.textContent='¡Copiado!';b.classList.add('ok');
  setTimeout(()=>{b.textContent=orig;b.classList.remove('ok')},1200);
});

function render(){
  if(!pedidos.length)return;
  const p=parseFloat(pct.value)||0;
  out.innerHTML=pedidos.map((d,i)=>{
    const p=(!manual&&d.pctAuto!=null)?d.pctAuto:(parseFloat(pct.value)||0);
    const conDesc=d.neto!=null?Math.round(d.neto*(1-p/100)*100)/100:null;
    const monto=d.neto!=null?Math.round(d.neto*p)/100:null;
    const faltan=!d.doc||!d.ped||!d.fecha||d.neto==null;
    rowsX[i]=faltan?null:[d.doc,d.ped,d.fecha,'$ '+fmt(d.neto),'$ '+fmt(monto),'$ '+fmt(conDesc)];
    return `<div class="card pedido"><div class="grid">
      <div><div class="k">Nro. doc. de venta</div><div class="v">${d.doc||'—'}${cpBtn(d.doc)}</div></div>
      <div><div class="k">Num.Pedi.Con</div><div class="v">${d.ped||'—'}${cpBtn(d.ped)}</div></div>
      <div><div class="k">Fecha</div><div class="v">${d.fecha||'—'}${cpBtn(d.fecha)}</div></div>
      <div><div class="k">Val.Neto</div><div class="v">${d.neto!=null?'$ '+fmt(d.neto):'—'}${d.neto!=null?cpBtn('$ '+fmt(d.neto)):''}</div></div>
      <div><div class="k">Descuento (${p}%)</div><div class="v">${monto!=null?'− $ '+fmt(monto):'—'}${monto!=null?cpBtn('$ '+fmt(monto)):''}</div></div>
      <div><div class="k">Val.Neto con descuento</div><div class="v big">${conDesc!=null?'$ '+fmt(conDesc):'—'}${conDesc!=null?cpBtn('$ '+fmt(conDesc)):''}</div></div>
    </div>
    ${faltan?'':`<div style="margin-top:14px"><button class="cp" style="margin-left:0;padding:8px 14px;font-size:.85rem;color:var(--tx)" data-c="${['Nro. doc. de venta: '+d.doc,'Num.Pedi.Con: '+d.ped,'Fecha: '+d.fecha,'Val.Neto: $ '+fmt(d.neto),'Descuento ('+p+'%): $ '+fmt(monto),'Val.Neto con descuento: $ '+fmt(conDesc)].join('\n')}">Copiar todo (listado)</button><button class="cx" data-i="${i}" type="button">Copiar para Excel (columnas)</button></div>`}
    ${d.descPdf!=null?`<div class="k" style="margin-top:12px">Desc. que figura en el PDF: ${fmt(d.descPdf)}</div>`:''}
    ${faltan?'<p class="warn">No se detectaron todos los campos. Revisá el texto extraído.</p>':''}
    </div>`}).join('')+
    `<details><summary>Ver texto extraído del PDF</summary><pre>${rawText.replace(/</g,'&lt;')}</pre></details>`;
}
</script>
</body>
</html>
